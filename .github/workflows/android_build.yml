name: Android Build & APK Generator

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36 Platform & Accept Licenses
        run: |
          echo "Accepting Android SDK licenses..."
          yes | sdkmanager --licenses || true
          echo "Installing Android SDK Platform 36 and Build Tools..."
          sdkmanager "platforms;android-36" "build-tools;36.0.0" || sdkmanager "platforms;android-36" "build-tools;35.0.0" || true

      - name: Restore Keystore & Configuration Files
        run: |
          # 1. Restore debug.keystore from base64
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
            echo "Successfully restored debug.keystore"
          fi
          
          # 2. Ensure .env exists from .env.example
          if [ ! -f ".env" ] && [ -f ".env.example" ]; then
            cp .env.example .env
            echo "Created .env from .env.example"
          elif [ ! -f ".env" ]; then
            touch .env
            echo "Created empty .env"
          fi

          # 3. Create dummy google-services.json if missing to prevent build warnings/errors
          if [ ! -f "app/google-services.json" ]; then
            cat << 'EOF' > app/google-services.json
            {
              "project_info": {
                "project_number": "123456789",
                "project_id": "cometa-ptt-app",
                "storage_bucket": "cometa-ptt-app.appspot.com"
              },
              "client": [
                {
                  "client_info": {
                    "mobilesdk_app_id": "1:123456789:android:abcdef0123456789",
                    "android_client_info": {
                      "package_name": "com.aistudio.cometa.ptt.a23k8p"
                    }
                  },
                  "oauth_client": [],
                  "api_key": [{ "current_key": "AIzaSyDummyKeyForBuildOnly1234567890" }],
                  "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
                }
              ],
              "configuration_version": "1"
            }
          EOF
            echo "Created fallback google-services.json"
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-read-only: false

      - name: Build Android Debug APK
        run: |
          gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cometa-PTT-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
