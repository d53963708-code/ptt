name: Android Build & APK Generator

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses & Install Platform 36
        run: |
          set -e
          SDKMANAGER_BIN="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -f "$SDKMANAGER_BIN" ]; then
            SDKMANAGER_BIN="sdkmanager"
          fi
          echo "Using sdkmanager: $SDKMANAGER_BIN"
          yes | $SDKMANAGER_BIN --licenses || true
          $SDKMANAGER_BIN "platforms;android-36" "build-tools;36.0.0" || true

      - name: Restore Keystore & Environment
        run: |
          # 1. Restore debug.keystore
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
            echo "Restored debug.keystore"
          fi

          # 2. Setup .env
          if [ ! -f ".env" ] && [ -f ".env.example" ]; then
            cp .env.example .env
            echo "Created .env"
          elif [ ! -f ".env" ]; then
            touch .env
            echo "Created empty .env"
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Build Android Debug APK
        run: |
          gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cometa-PTT-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
