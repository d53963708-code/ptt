name: Android Build & APK Generator

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses & Install Platform 36
        run: |
          set -e
          SDKMANAGER_BIN="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -f "$SDKMANAGER_BIN" ]; then
            SDKMANAGER_BIN="sdkmanager"
          fi
          echo "Using sdkmanager: $SDKMANAGER_BIN"
          yes | $SDKMANAGER_BIN --licenses || true
          $SDKMANAGER_BIN "platforms;android-36" "build-tools;36.0.0" || true

      - name: Restore Keystore, Environment & Services
        run: |
          # 1. Restore debug.keystore
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
            echo "Restored debug.keystore"
          fi

          # 2. Setup .env
          if [ ! -f ".env" ] && [ -f ".env.example" ]; then
            cp .env.example .env
            echo "Created .env"
          elif [ ! -f ".env" ]; then
            touch .env
            echo "Created empty .env"
          fi

          # 3. Dummy google-services.json if missing
          if [ ! -f "app/google-services.json" ]; then
            echo '{"project_info":{"project_number":"123456789","project_id":"cometa-ptt-app","storage_bucket":"cometa-ptt-app.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:123456789:android:abcdef0123456789","android_client_info":{"package_name":"com.aistudio.cometa.ptt.a23k8p"}},"oauth_client":[],"api_key":[{"current_key":"AIzaSyDummyKey1234567890"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}' > app/google-services.json
            echo "Created fallback google-services.json"
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-read-only: false

      - name: Generate Wrapper & Build APK
        run: |
          echo "Running Gradle assembleDebug..."
          gradle wrapper
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cometa-PTT-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
