name: Android Build & APK Generator

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Restore Keystore & Secrets (.env)
        run: |
          # Recreate debug.keystore from base64 if present
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
            echo "Restored debug.keystore"
          fi
          
          # Prepare .env from .env.example
          if [ ! -f ".env" ] && [ -f ".env.example" ]; then
            cp .env.example .env
            echo "Generated .env from .env.example"
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission for Gradlew
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          else
            echo "Generating Gradle wrapper..."
            gradle wrapper
            chmod +x ./gradlew
          fi

      - name: Build Debug APK
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cometa-PTT-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
